{% block content %}<div class="page-heading"><div><span class="eyebrow dark">Kontrol akses</span><h1>Tambah Pengguna</h1><p>Admin dapat membuat akun User maupun Admin baru.</p></div><a class="btn btn-light" href="{{ url_for('users.users') }}"><i class="fa-solid fa-arrow-left"></i> Kembali</a></div><article class="panel form-panel"><form method="post"><div class="row g-4"><div class="col-md-6"><label class="form-label">Nama lengkap</label><input class="form-control" name="nama_lengkap" required></div><div class="col-md-6"><label class="form-label">Username</label><input class="form-control" name="username" required></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div><div class="col-md-3"><label class="form-label">Role</label><select class="form-select" name="role"><option value="user">User</option><option value="admin">Admin</option></select></div><div class="col-md-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="8" required></div><div class="col-12 d-flex justify-content-end gap-2"><a class="btn btn-light" href="{{ url_for('users.users') }}">Batal</a><button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk"></i> Simpan Pengguna</button></div></div></form></article>{% endblock %}
