<form class="panel filter-panel" method="get" id="monitoringFilters">
  <div class="filter-head"><div><span class="eyebrow dark">Penyaring data</span><h2>Filter monitoring</h2></div><button class="filter-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#filterBody"><i class="fa-solid fa-sliders"></i></button></div>
  <div class="collapse show" id="filterBody"><div class="row g-3 align-items-end">
    <div class="col-md-4 col-xl-2"><label class="form-label">Kecamatan</label><select class="form-select" name="kec_code" id="kecFilter"><option value="">Semua Kecamatan</option>{% for item in filter_options.kecamatan %}<option value="{{ item.code }}" {{ 'selected' if filters.kec_code == item.code }}>{{ item.code }} · {{ item.name }}</option>{% endfor %}</select></div>
    <div class="col-md-4 col-xl-2"><label class="form-label">Desa</label><select class="form-select" name="desa_code" id="desaFilter"><option value="">Semua Desa</option>{% for item in filter_options.desa %}<option value="{{ item.code }}" {{ 'selected' if filters.desa_code == item.code }}>{{ item.code }} · {{ item.name }}</option>{% endfor %}</select></div>
    <div class="col-md-4 col-xl-2"><label class="form-label">PML</label><select class="form-select" name="pml_id" id="pmlFilter"><option value="">Semua PML</option>{% for item in filter_options.pml %}<option value="{{ item.id }}" {{ 'selected' if filters.pml_id == item.id }}>{{ item.name }}</option>{% endfor %}</select></div>
    <div class="col-md-4 col-xl-2"><label class="form-label">PCL</label><select class="form-select" name="pcl_id" id="pclFilter"><option value="">Semua PCL</option>{% for item in filter_options.pcl %}<option value="{{ item.id }}" {{ 'selected' if filters.pcl_id == item.id }}>{{ item.name }}</option>{% endfor %}</select></div>
    <div class="col-md-4 col-xl-2"><label class="form-label">Status</label><select class="form-select" name="status"><option value="">Semua Status</option>{% for status in ['Data Kosong','Belum Mulai','Sedang Proses','Selesai'] %}<option value="{{ status }}" {{ 'selected' if filters.status == status }}>{{ status }}</option>{% endfor %}</select></div>
    <div class="col-md-4 col-xl-2"><label class="form-label">Progress (%)</label><div class="input-group"><input class="form-control" type="number" min="0" max="100" step="0.01" name="progress_min" placeholder="Min" value="{{ filters.progress_min if filters.progress_min is not none else '' }}"><input class="form-control" type="number" min="0" max="100" step="0.01" name="progress_max" placeholder="Maks" value="{{ filters.progress_max if filters.progress_max is not none else '' }}"></div></div>
    <div class="col-12 d-flex gap-2 justify-content-end"><a class="btn btn-light" href="{{ request.path }}"><i class="fa-solid fa-rotate-left"></i> Reset Filter</a><button class="btn btn-primary" type="submit"><i class="fa-solid fa-filter"></i> Terapkan Filter</button></div>
  </div></div>
</form>
